    &gt; whoami
  </text>

  <text
    x="60"
    y="280"
    fill="#c9d1d9"
    font-family="monospace"
    font-size="15"
  >
    ArthurRLZ@github:~$ coding...
  </text>

  <text
    x="60"
    y="305"
    fill="#58a6ff"
    font-family="monospace"
    font-size="14"
  >
    status: ONLINE ●
  </text>

</svg>
