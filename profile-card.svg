  <circle cx="62" cy="217" r="5" fill="#ff7b72"/>
  <circle cx="80" cy="217" r="5" fill="#d29922"/>
  <circle cx="98" cy="217" r="5" fill="#3fb950"/>

  <text
    x="60"
    y="255"
    fill="#7ee787"
    font-family="monospace"
    font-size="15"
