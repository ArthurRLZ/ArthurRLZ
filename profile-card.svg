<svg fill="none" viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://w3.org">
  <!-- 1. Define the Pattern and Styles -->
  <defs>
    <!-- Seamless Grid/Dot Pattern -->
    <pattern id="dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#30363d" />
    </pattern>

    <!-- External Fonts and Custom CSS -->
    <style>
      @import url('https://googleapis.com');

      .card-body {
        font-family: 'Inter', sans-serif;
        color: #c9d1d9;
        padding: 40px;
        height: 100%;
        box-sizing: border-box;
      }

      h1 {
        color: #58a6ff;
        font-size: 32px;
        margin-bottom: 5px;
        animation: fadeIn 1.5s ease-in-out;
      }

      /* Example CSS Animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- 2. Apply Background Color and the SVG Pattern -->
  <rect width="100%" height="100%" fill="#0d1117" rx="10" />
  <rect width="100%" height="100%" fill="url(#dot-pattern)" rx="10" />

  <!-- 3. Embed Rich HTML via foreignObject -->
  <foreignObject x="0" y="0" width="800" height="400">
    <div xmlns="http://w3.org" class="card-body">
      <h1>Hi there, I'm a Developer! 👋</h1>
      <p>This entire layout is styled using CSS grid, custom fonts, and animated patterns inside an SVG.</p>
    </div>
  </foreignObject>
</svg>
